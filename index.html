<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>症状记录本</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="症状记录本">
<meta name="theme-color" content="#fdf2f7">
<link rel="apple-touch-icon" href="apple-touch-icon.png">

<style>
:root{
--pink:#ef6a9e;--pink-dark:#d64f82;--pink-soft:#fce4ec;--bg:#fdf2f7;--border:#f3d3e0;
--text:#4a2b3a;--text2:#8a6070;
--kimi-font-sans:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
}
body{margin:0;padding:14px;background:var(--bg)}
</style>
</head>
<body>
<div id="sd" class="sd">
<style>
.sd{font-family:var(--kimi-font-sans);font-size:17px;line-height:1.55;color:var(--text);max-width:540px;margin:0 auto}
.sd *{box-sizing:border-box}
.sd button,.sd input,.sd select,.sd textarea{font:inherit;color:inherit}
.sd [hidden]{display:none!important}
.sd svg{display:inline-block;vertical-align:-2px}
.hd{text-align:center;padding:8px 0 4px}
.hd .icos{display:flex;justify-content:center;gap:14px;color:var(--pink);margin-bottom:8px}
.hd .icos svg{width:26px;height:26px}
.hd h1{font-size:21px;font-weight:500;margin:0}
.hd .sub2{font-size:14px;color:var(--text2);margin-top:4px}
.cnt{font-size:14px;color:var(--text2)}
.tabs{display:flex;gap:4px;background:#fff;border:1px solid var(--border);padding:4px;border-radius:12px;margin:14px 0}
.tabs button{flex:1;border:0;background:transparent;padding:10px 4px;border-radius:8px;font-size:16px;font-weight:500;color:var(--text2);cursor:pointer}
.tabs button.on{background:var(--pink);color:#fff}
.card{background:#fff;border:1px solid var(--border);border-radius:14px;padding:16px;margin-bottom:12px}
.card>label{display:flex;align-items:center;gap:6px;font-size:15px;font-weight:500;margin-bottom:8px}
.card>label svg{width:16px;height:16px;color:var(--pink)}
.ct{display:flex;align-items:center;gap:6px;font-size:16px;font-weight:500;margin-bottom:10px}
.ct svg{width:18px;height:18px;color:var(--pink)}
.sub{font-weight:400;font-size:14px;color:var(--text2)}
.in,.ta{width:100%;border:1px solid var(--border);border-radius:10px;padding:12px;font-size:16px;background:#fff}
.ta{min-height:72px;resize:vertical}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 8px}
.chip{border:1px solid var(--border);background:#fff;border-radius:999px;padding:8px 14px;font-size:15px;color:var(--text2);cursor:pointer}
.chip.on{background:var(--pink);border-color:var(--pink);color:#fff}
.row2{display:flex;gap:12px;align-items:center}
.temp{font-size:36px;font-weight:500;font-variant-numeric:tabular-nums;color:var(--pink-dark)}
input[type=range]{flex:1;accent-color:var(--pink)}
.warm{color:#b54708;background:#fdf1e7;border-radius:999px;padding:2px 10px}
.hot{color:#d92d20;background:#fdecea;border-radius:999px;padding:2px 10px}
.btn{border:0;border-radius:10px;padding:14px;font-size:16px;font-weight:500;cursor:pointer}
.pri{background:var(--pink);color:#fff;width:100%;display:flex;align-items:center;justify-content:center;gap:8px}
.gho{background:#fff;border:1px solid var(--border);color:var(--text2);padding:10px 14px;font-size:15px}
.tools{display:flex;gap:8px;margin-bottom:12px}
.rec{background:#fff;border:1px solid var(--border);border-radius:14px;padding:14px 16px;margin-bottom:12px;cursor:pointer}
.rh{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.dt{font-weight:500;font-size:16px}
.bdg{font-size:14px;border-radius:999px;padding:2px 10px;background:var(--pink-soft);color:var(--pink-dark)}
.sm{color:var(--text2);font-size:15px;margin-top:6px}
.dl{margin:12px 0 0;border-top:1px solid var(--border);padding-top:12px}
.dl>div{display:flex;gap:8px;padding:4px 0;font-size:15px}
.dl b{font-weight:500;min-width:64px;color:var(--text2)}
.rf{display:flex;gap:8px;margin-top:12px}
.empty{text-align:center;color:var(--text2);padding:32px 16px;font-size:15px}
.toast{margin-top:12px;padding:12px 14px;border-radius:10px;font-size:15px;display:none;background:var(--pink-soft);color:var(--pink-dark)}
.bar-row{display:flex;align-items:center;gap:8px;padding:5px 0;font-size:15px}
.bar-name{min-width:72px;color:var(--text)}
.bar-track{flex:1;height:14px;background:var(--pink-soft);border-radius:7px;overflow:hidden}
.bar-fill{display:block;height:100%;background:var(--pink);border-radius:7px}
.bar-n{width:24px;text-align:right;color:var(--text2);font-size:14px}
.hint{font-size:14px;color:var(--text2);text-align:center;padding:8px}
.chart{width:100%;height:auto}
</style>

<div class="hd">
  <div class="icos">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M14 4a2 2 0 1 0-4 0v9.2a4 4 0 1 0 4 0z"/><line x1="12" y1="8" x2="12" y2="15"/></svg>
    <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 20.3C7 16.6 3.6 13.4 3.6 9.7 3.6 7.2 5.6 5.2 8 5.2c1.6 0 3.1.8 4 2.1.9-1.3 2.4-2.1 4-2.1 2.4 0 4.4 2 4.4 4.5 0 3.7-3.4 6.9-8.4 10.6z"/></svg>
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8.5"/><circle cx="9" cy="10" r="0.6" fill="currentColor"/><circle cx="15" cy="10" r="0.6" fill="currentColor"/><path d="M8.5 14c1 1.2 2.2 1.8 3.5 1.8s2.5-.6 3.5-1.8"/></svg>
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20.5 14.5A8.5 8.5 0 1 1 9.5 3.5a7 7 0 0 0 11 11z"/></svg>
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12h16a8 8 0 0 1-16 0z"/><path d="M9.5 8.5c0-1.4 1.2-1.5 1.2-2.8M14.3 8.5c0-1.4 1.2-1.5 1.2-2.8"/></svg>
  </div>
  <h1>症状记录</h1>
  <div class="sub2">小小病历本 · 记下每一次不舒服</div>
</div>

<nav class="tabs"><button id="tF" class="on" type="button">记一笔</button><button id="tL" type="button">历史</button><button id="tT" type="button">统计</button></nav>

<section id="vF">
  <div class="card"><label>时间</label><input type="datetime-local" id="fTime" class="in"></div>
  <div class="card">
    <label><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M14 4a2 2 0 1 0-4 0v9.2a4 4 0 1 0 4 0z"/><line x1="12" y1="8" x2="12" y2="15"/></svg>体温 <span id="tState" class="sub"></span></label>
    <div class="row2"><span class="temp" id="tVal">36.6</span><span>°C</span></div>
    <div class="row2" style="margin-top:8px"><input type="range" id="fTR" min="35" max="42" step="0.1" value="36.6"><input type="number" id="fTN" class="in" min="35" max="42" step="0.1" value="36.6" style="width:96px;flex:none"></div>
    <label style="margin-top:12px;font-weight:400;font-size:15px;display:flex;align-items:center;gap:8px;margin-bottom:0"><input type="checkbox" id="fNoT"> 本次未测体温</label>
  </div>
  <div class="card"><label><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 20.3C7 16.6 3.6 13.4 3.6 9.7 3.6 7.2 5.6 5.2 8 5.2c1.6 0 3.1.8 4 2.1.9-1.3 2.4-2.1 4-2.1 2.4 0 4.4 2 4.4 4.5 0 3.7-3.4 6.9-8.4 10.6z"/></svg>症状</label><div class="chips" id="cSym"></div><textarea id="fSym" class="ta" placeholder="主要不舒服的地方，可直接点上面标签，也可自己写"></textarea></div><div class="card"><label>精神状态</label><div class="chips" id="cSpi"></div><input type="text" id="fSpi" class="in" placeholder="其他描述，如：比平时烦躁、蔫蔫的"></div>
  <div class="card"><label><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12h16a8 8 0 0 1-16 0z"/><path d="M9.5 8.5c0-1.4 1.2-1.5 1.2-2.8M14.3 8.5c0-1.4 1.2-1.5 1.2-2.8"/></svg>饮食</label><div class="chips" id="cDiet"></div><input type="text" id="fDiet" class="in" placeholder="其他描述，如：只想喝粥、饭后腹胀"></div>
  <div class="card"><label><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20.5 14.5A8.5 8.5 0 1 1 9.5 3.5a7 7 0 0 0 11 11z"/></svg>睡眠</label><div class="chips" id="cSlp"></div><input type="text" id="fSlp" class="in" placeholder="其他描述，如：午睡也难入睡"></div>
  <div class="card"><label>脉象</label><div class="chips" id="cPul"></div><input type="text" id="fPul" class="in" placeholder="其他脉象描述，如：右脉弦细"></div>
  <div class="card"><label>舌苔</label><div class="chips" id="cTon"></div><input type="text" id="fTon" class="in" placeholder="其他舌象描述"></div>
  <div class="card"><label>大便情况</label><div class="chips" id="cSto"></div><input type="text" id="fSto" class="in" placeholder="其他描述，如：一日三次、气味重"></div>
  <div class="card"><label>小便情况</label><div class="chips" id="cUri"></div><input type="text" id="fUri" class="in" placeholder="其他描述"></div>
  <div class="card"><label>可能原因</label><input type="text" id="fCau" class="in" placeholder="如：昨晚受凉、吃了生冷、熬夜上火"></div>
  <div class="card"><label>医生看诊</label><textarea id="fVis" class="ta" placeholder="医院 / 科室 / 医生、诊断结论、医嘱"></textarea></div>
  <div class="card"><label>药物记录</label><textarea id="fMed" class="ta" placeholder="药名、剂量、频次、开始 / 停止时间、服药后反应"></textarea></div>
  <div class="card"><label>备注</label><textarea id="fNot" class="ta" placeholder="其他任何想记下的"></textarea></div>
  <button class="btn pri" id="bSave" type="button">保存这条记录</button>
</section>

<section id="vL" hidden>
  <div class="tools"><button class="btn gho" id="bCopy" type="button">复制全部</button><button class="btn gho" id="bDl" type="button">导出文件</button></div>
  <div id="recs"></div>
</section>

<section id="vT" hidden>
  <div class="card">
    <div class="ct"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 20v-6M11 20V6M17 20v-9"/><path d="M3 20h18"/></svg>体温趋势</div>
    <svg id="tChart" class="chart" viewBox="0 0 340 200"></svg>
    <div class="hint" id="tHint"></div>
  </div>
  <div class="card">
    <div class="ct"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 20.3C7 16.6 3.6 13.4 3.6 9.7 3.6 7.2 5.6 5.2 8 5.2c1.6 0 3.1.8 4 2.1.9-1.3 2.4-2.1 4-2.1 2.4 0 4.4 2 4.4 4.5 0 3.7-3.4 6.9-8.4 10.6z"/></svg>常见症状排行</div>
    <div id="symBars"></div>
  </div>
</section>
<div class="toast" id="toast"></div>

<script>
(function(){
var D={
sym:"发热|怕冷|无汗|有汗|咳嗽|有痰|咽痛|咽干|头痛|身痛|乏力|流涕|鼻塞|打喷嚏|腹泻|呕吐|腹痛|皮疹|瘙痒|口干|口苦|口淡|失眠|多梦|食欲差|心慌|胸闷".split("|"),
spi:"精神好|精神萎靡|倦怠|烦躁|嗜睡|比平时闹".split("|"),
diet:"正常|食欲差|厌食|多食易饿|恶心|口渴喜凉|喜热饮".split("|"),
slp:"正常|入睡难|易醒|多梦|早醒|睡不安稳".split("|"),
pul:"浮|沉|迟|数|滑|涩|弦|细|洪|弱|结|代|有力|无力".split("|"),
ton:"薄白|白厚|黄腻|厚腻|少苔|剥苔|舌淡|舌红|舌绛|齿痕|裂纹|水滑".split("|"),
sto:"正常|稀溏|水样|便秘|干硬|便血|黑便|未解|里急后重|黏马桶".split("|"),
uri:"正常|清长|短赤|深黄|频数|夜尿多|泡沫多|量少|排尿痛".split("|")};
var KEY="symptom-diary-v1",MEM=[];
function load(){try{var d=JSON.parse(localStorage.getItem(KEY));if(d)return d}catch(e){}return MEM}
function persist(d){MEM=d;try{localStorage.setItem(KEY,JSON.stringify(d))}catch(e){}}
var recs=load();
var $=function(id){return document.getElementById(id)};
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function chipify(id,arr,cb){var box=$(id);box.innerHTML="";arr.forEach(function(a){var b=document.createElement("button");b.type="button";b.className="chip";b.textContent=a;b.onclick=function(){b.classList.toggle("on");cb&&cb(a,b.classList.contains("on"))};box.appendChild(b)})}
function picked(id){return [].slice.call(document.querySelectorAll("#"+id+" .chip.on")).map(function(b){return b.textContent})}
function combine(cid,fid){var c=picked(cid),f=$(fid).value.trim();return c.concat(f?[f]:[]).join("、")}
chipify("cSym",D.sym,function(a,on){var ta=$("fSym"),ts=ta.value.split(/[、,，;；\s]+/).filter(Boolean),i=ts.indexOf(a);if(on&&i<0)ts.push(a);if(!on&&i>=0)ts.splice(i,1);ta.value=ts.join("、")});
chipify("cSpi",D.spi);chipify("cDiet",D.diet);chipify("cSlp",D.slp);
chipify("cPul",D.pul);chipify("cTon",D.ton);chipify("cSto",D.sto);chipify("cUri",D.uri);
var r=$("fTR"),n=$("fTN"),v=$("tVal"),st=$("tState");
function tshow(){var t=parseFloat(r.value);v.textContent=t.toFixed(1);n.value=t.toFixed(1);st.className="sub";st.textContent="";if(t>=38.5){st.textContent="高热";st.className="sub hot"}else if(t>=37.3){st.textContent="发热";st.className="sub warm"}}
r.oninput=tshow;n.oninput=function(){var x=parseFloat(n.value);if(!isNaN(x)&&x>=35&&x<=42){r.value=x;tshow()}};
$("fNoT").onchange=function(){r.disabled=n.disabled=this.checked};
function nowLocal(){var d=new Date();d.setMinutes(d.getMinutes()-d.getTimezoneOffset());return d.toISOString().slice(0,16)}
$("fTime").value=nowLocal();
var tt;function toast(m){var e=$("toast");e.textContent=m;e.style.display="block";clearTimeout(tt);tt=setTimeout(function(){e.style.display="none"},1800)}
function show(t){$("vF").hidden=t!=="f";$("vL").hidden=t!=="l";$("vT").hidden=t!=="t";$("tF").className=t==="f"?"on":"";$("tL").className=t==="l"?"on":"";$("tT").className=t==="t"?"on":"";if(t==="l")render();if(t==="t")renderStats()}
$("tF").onclick=function(){show("f")};$("tL").onclick=function(){show("l")};$("tT").onclick=function(){show("t")};
function clearForm(){$("fSym").value=$("fSpi").value=$("fDiet").value=$("fSlp").value=$("fPul").value=$("fTon").value=$("fSto").value=$("fUri").value=$("fCau").value=$("fVis").value=$("fMed").value=$("fNot").value="";["cSym","cSpi","cDiet","cSlp","cPul","cTon","cSto","cUri"].forEach(function(id){[].slice.call($(id).children).forEach(function(b){b.classList.remove("on")})});$("fNoT").checked=false;r.disabled=n.disabled=false;r.value=36.6;tshow();$("fTime").value=nowLocal()}
function save(){var noT=$("fNoT").checked;var it={id:Date.now(),time:$("fTime").value||new Date().toISOString(),temp:noT?null:parseFloat(r.value),symptoms:$("fSym").value.trim(),spirit:combine("cSpi","fSpi"),diet:combine("cDiet","fDiet"),sleep:combine("cSlp","fSlp"),pulse:combine("cPul","fPul"),tongue:combine("cTon","fTon"),stool:combine("cSto","fSto"),urine:combine("cUri","fUri"),cause:$("fCau").value.trim(),visit:$("fVis").value.trim(),meds:$("fMed").value.trim(),note:$("fNot").value.trim()};recs.push(it);persist(recs);clearForm();show("l");toast("已保存")}
$("bSave").onclick=save;
function fmt(t){var d=new Date(String(t).replace(/-/g,"/").replace("T"," "));if(isNaN(d))return String(t);function p(x){return x<10?"0"+x:""+x}return (d.getMonth()+1)+"月"+d.getDate()+"日 "+p(d.getHours())+":"+p(d.getMinutes())}
function lines(it){var L=[["时间",fmt(it.time)],["体温",it.temp==null?"未测":it.temp.toFixed(1)+" ℃"],["症状",it.symptoms],["精神状态",it.spirit],["饮食",it.diet],["睡眠",it.sleep],["脉象",it.pulse],["舌苔",it.tongue],["大便",it.stool],["小便",it.urine],["可能原因",it.cause],["医生看诊",it.visit],["药物",it.meds],["备注",it.note]];return L.filter(function(p){return p[1]})}
function promptFor(it){var s="我记了一次生病的症状记录，请从中医角度帮我分析可能的证型、病机，并给日常调理建议（仅供参考，我会结合医生面诊）。\n";lines(it).forEach(function(p){s+=p[0]+"："+p[1]+"\n"});return s}
function render(){$("cnt").textContent=recs.length?("共 "+recs.length+" 条"):"";var box=$("recs");box.innerHTML="";if(!recs.length){box.innerHTML='<div class="empty">还没有记录，点上方「记一笔」开始第一条</div>';return}recs.slice().sort(function(a,b){return a.time<b.time?1:-1}).forEach(function(it){var div=document.createElement("div");div.className="rec";var tb="";if(it.temp!=null){var cls=it.temp>=38.5?"hot":(it.temp>=37.3?"warm":"");tb='<span class="bdg '+cls+'">'+it.temp.toFixed(1)+"℃</span>"}div.innerHTML='<div class="rh"><span class="dt">'+fmt(it.time)+"</span>"+tb+'</div><div class="sm">'+(it.symptoms||"（未填症状）")+"</div>";var dl=document.createElement("div");dl.className="dl";dl.hidden=true;lines(it).forEach(function(p){if(p[0]==="时间")return;var d=document.createElement("div");var b=document.createElement("b");b.textContent=p[0];var sp=document.createElement("span");sp.textContent=p[1];d.appendChild(b);d.appendChild(sp);dl.appendChild(d)});var rf=document.createElement("div");rf.className="rf";rf.hidden=true;var ask=document.createElement("button");ask.className="btn gho";ask.type="button";ask.textContent="发给 Kimi 分析";ask.onclick=function(e){e.stopPropagation();if(window.sendPrompt)window.sendPrompt(promptFor(it));else toast("当前环境不支持")};var del=document.createElement("button");del.className="btn gho";del.type="button";del.textContent="删除";del.onclick=function(e){e.stopPropagation();if(confirm("删除这条记录？")){recs=recs.filter(function(x){return x.id!==it.id});persist(recs);render()}};rf.appendChild(ask);rf.appendChild(del);div.onclick=function(){dl.hidden=!dl.hidden;rf.hidden=dl.hidden};div.appendChild(dl);div.appendChild(rf);box.appendChild(div)})}
function renderStats(){
  var svg=$("tChart"),hint=$("tHint");
  var pts=recs.filter(function(x){return x.temp!=null}).sort(function(a,b){return a.time<b.time?-1:1});
  if(!pts.length){svg.style.display="none";hint.textContent="还没有体温记录，先记几笔带体温的记录吧";}else{
    svg.style.display="";hint.textContent="";
    var W=340,H=200,L=36,R=10,T=16,B=30;
    var ts=pts.map(function(p){return p.temp});
    var lo=Math.max(35,Math.floor((Math.min.apply(null,ts)-0.5)*2)/2),hi=Math.min(42,Math.ceil((Math.max.apply(null,ts)+0.5)*2)/2);
    if(hi-lo<2){lo=Math.max(35,lo-1);hi=Math.min(42,hi+1)}
    function X(i){return pts.length==1?(W+L-R)/2:L+i*(W-L-R)/(pts.length-1)}
    function Y(t){return T+(hi-t)*(H-T-B)/(hi-lo)}
    var s="",step=(hi-lo)>4?1:0.5;
    for(var g=Math.ceil(lo/step)*step;g<=hi+0.001;g+=step){var y=Y(g);s+='<line x1="'+L+'" y1="'+y+'" x2="'+(W-R)+'" y2="'+y+'" stroke="#f0dbe4" stroke-width="1"/><text x="'+(L-5)+'" y="'+(y+3)+'" font-size="9" text-anchor="end" fill="#8a6070">'+g.toFixed(step<1?1:0)+"</text>"}
    if(37.3>lo&&37.3<hi){var fy=Y(37.3);s+='<line x1="'+L+'" y1="'+fy+'" x2="'+(W-R)+'" y2="'+fy+'" stroke="#d92d20" stroke-width="1.2" stroke-dasharray="4 3"/><text x="'+(W-R-2)+'" y="'+(fy-4)+'" font-size="9" text-anchor="end" fill="#d92d20">37.3℃ 发热线</text>'}
    var d="";pts.forEach(function(p,i){d+=(i?"L":"M")+X(i).toFixed(1)+" "+Y(p.temp).toFixed(1)+" "});
    s+='<path d="'+d.trim()+'" fill="none" stroke="#ef6a9e" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>';
    var k=Math.ceil(pts.length/6);
    pts.forEach(function(p,i){var x=X(i),y=Y(p.temp);
      s+='<circle cx="'+x+'" cy="'+y+'" r="3.2" fill="#fff" stroke="#ef6a9e" stroke-width="2"/>';
      if(pts.length<=10){s+='<text x="'+x+'" y="'+(y-7)+'" font-size="9" text-anchor="middle" fill="#d64f82">'+p.temp.toFixed(1)+"</text>"}
      if(i%k==0){var lab=(p.time||"").slice(5,10).replace("-","/");s+='<text x="'+x+'" y="'+(H-8)+'" font-size="9" text-anchor="middle" fill="#8a6070">'+esc(lab)+"</text>"}});
    svg.innerHTML=s;
  }
  var box=$("symBars"),cnt={};
  recs.forEach(function(r){String(r.symptoms||"").split(/[、,，;；\s]+/).forEach(function(t){t=t.trim();if(t)cnt[t]=(cnt[t]||0)+1})});
  var arr=Object.keys(cnt).map(function(k){return [k,cnt[k]]}).sort(function(a,b){return b[1]-a[1]}).slice(0,8);
  box.innerHTML=arr.length?arr.map(function(p){return '<div class="bar-row"><span class="bar-name">'+esc(p[0])+'</span><span class="bar-track"><span class="bar-fill" style="width:'+(p[1]/arr[0][1]*100)+'%"></span></span><span class="bar-n">'+p[1]+"</span></div>"}).join(""):'<div class="hint">还没有症状记录</div>';
}
function allText(){return recs.slice().sort(function(a,b){return a.time<b.time?1:-1}).map(function(it){return lines(it).map(function(p){return p[0]+"："+p[1]}).join("\n")}).join("\n----\n")}
function copyAll(){if(!recs.length){toast("还没有记录");return}var s=allText();var done=function(){toast("已复制 "+recs.length+" 条记录")};if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(s).then(done,function(){fb(s)})}else fb(s)}
function fb(s){var ta=document.createElement("textarea");ta.value=s;document.body.appendChild(ta);ta.select();try{document.execCommand("copy");toast("已复制")}catch(e){toast("复制失败，请手动选择")}ta.remove()}
function dl(){if(!recs.length){toast("还没有记录");return}var blob=new Blob([JSON.stringify(recs,null,2)],{type:"application/json"});var a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="症状记录.json";a.click();toast("已导出文件")}
$("bCopy").onclick=copyAll;$("bDl").onclick=dl;
tshow();render();
})();
</script>
</div>
</body>
</html>
