<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>症状记录本</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="症状记录本">
<meta name="theme-color" content="#f7f7f9">
<link rel="apple-touch-icon" href="apple-touch-icon.png">

<style>
:root{
--kimi-font-sans:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
--kimi-color-text-primary:#1c1c1e;--kimi-color-text-secondary:#3a3a3c;--kimi-color-text-tertiary:#6c6c70;--kimi-color-text-quaternary:#aeaeb2;
--kimi-color-surface:#ffffff;--kimi-color-surface-muted:#f2f2f5;--kimi-color-surface-raised:#ffffff;--kimi-color-surface-strong:#e9e9ee;
--kimi-color-border:#d9d9de;--kimi-color-danger:#d92d20;--kimi-color-positive:#12855f;--kimi-color-warning:#b54708;--kimi-color-accent:#0f62fe;
}
body{margin:0;padding:16px;background:#f7f7f9}
</style>
<base target="_blank">
</head>
<body>
<div id="sd" class="sd">
<style>
.sd{font-family:var(--kimi-font-sans,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif);font-size:17px;line-height:1.55;color:var(--kimi-color-text-primary,#1c1c1e);max-width:540px;margin:0 auto}
.sd *{box-sizing:border-box}
.sd button,.sd input,.sd select,.sd textarea{font:inherit;color:inherit}
.sd [hidden]{display:none!important}
.top{display:flex;align-items:baseline;justify-content:space-between;margin:0 0 12px}
.top h1{font-size:19px;font-weight:500;margin:0}
.cnt{font-size:14px;color:var(--kimi-color-text-tertiary,#6c6c70)}
.tabs{display:flex;gap:4px;background:var(--kimi-color-surface-muted,#f2f2f5);padding:4px;border-radius:12px;margin-bottom:16px}
.tabs button{flex:1;border:0;background:transparent;padding:10px;border-radius:8px;font-size:16px;font-weight:500;color:var(--kimi-color-text-secondary,#3a3a3c);cursor:pointer}
.tabs button.on{background:var(--kimi-color-text-primary,#1c1c1e);color:var(--kimi-color-surface,#fff)}
.card{border:1px solid var(--kimi-color-border,#d9d9de);border-radius:12px;padding:16px;margin-bottom:12px}
.card>label{display:block;font-size:15px;font-weight:500;margin-bottom:8px}
.sub{font-weight:400;font-size:14px;color:var(--kimi-color-text-tertiary,#6c6c70)}
.in,.ta{width:100%;border:1px solid var(--kimi-color-border,#d9d9de);border-radius:10px;padding:12px;background:var(--kimi-color-surface,#fff);font-size:16px}
.ta{min-height:72px;resize:vertical}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 8px}
.chip{border:1px solid var(--kimi-color-border,#d9d9de);background:transparent;border-radius:999px;padding:8px 14px;font-size:15px;color:var(--kimi-color-text-secondary,#3a3a3c);cursor:pointer}
.chip.on{background:var(--kimi-color-text-primary,#1c1c1e);border-color:var(--kimi-color-text-primary,#1c1c1e);color:var(--kimi-color-surface,#fff)}
.row2{display:flex;gap:12px;align-items:center}
.temp{font-size:36px;font-weight:500;font-variant-numeric:tabular-nums}
input[type=range]{flex:1;accent-color:var(--kimi-color-text-primary,#1c1c1e)}
.warm{color:var(--kimi-color-warning,#b54708);background:color-mix(in srgb,var(--kimi-color-warning,#b54708) 14%,transparent);border-radius:999px;padding:2px 10px}
.hot{color:var(--kimi-color-danger,#d92d20);background:color-mix(in srgb,var(--kimi-color-danger,#d92d20) 12%,transparent);border-radius:999px;padding:2px 10px}
.btn{border:0;border-radius:10px;padding:14px;font-size:16px;font-weight:500;cursor:pointer}
.pri{background:var(--kimi-color-text-primary,#1c1c1e);color:var(--kimi-color-surface,#fff);width:100%;display:flex;align-items:center;justify-content:center;gap:8px}
.gho{background:transparent;border:1px solid var(--kimi-color-border,#d9d9de);color:var(--kimi-color-text-secondary,#3a3a3c);padding:10px 14px;font-size:15px}
.tools{display:flex;gap:8px;margin-bottom:12px}
.rec{border:1px solid var(--kimi-color-border,#d9d9de);border-radius:12px;padding:14px 16px;margin-bottom:12px;cursor:pointer}
.rh{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.dt{font-weight:500;font-size:16px}
.bdg{font-size:14px;border-radius:999px;padding:2px 10px}
.sm{color:var(--kimi-color-text-secondary,#3a3a3c);font-size:15px;margin-top:6px}
.dl{margin:12px 0 0;border-top:1px solid var(--kimi-color-border,#d9d9de);padding-top:12px}
.dl>div{display:flex;gap:8px;padding:4px 0;font-size:15px}
.dl b{font-weight:500;min-width:64px;color:var(--kimi-color-text-tertiary,#6c6c70)}
.rf{display:flex;gap:8px;margin-top:12px}
.empty{text-align:center;color:var(--kimi-color-text-tertiary,#6c6c70);padding:32px 16px;font-size:15px}
.toast{margin-top:12px;padding:12px 14px;border-radius:10px;font-size:15px;display:none;background:color-mix(in srgb,var(--kimi-color-positive,#12855f) 14%,transparent)}
</style>

<div class="top"><h1>症状记录</h1><span class="cnt" id="cnt"></span></div>
<nav class="tabs"><button id="tF" class="on" type="button">记一笔</button><button id="tL" type="button">历史记录</button></nav>

<section id="vF">
  <div class="card"><label>时间</label><input type="datetime-local" id="fTime" class="in"></div>
  <div class="card">
    <label>体温 <span id="tState" class="sub"></span></label>
    <div class="row2"><span class="temp" id="tVal">36.6</span><span>°C</span></div>
    <div class="row2" style="margin-top:8px"><input type="range" id="fTR" min="35" max="42" step="0.1" value="36.6"><input type="number" id="fTN" class="in" min="35" max="42" step="0.1" value="36.6" style="width:96px;flex:none"></div>
    <label style="margin-top:12px;font-weight:400;font-size:15px;display:flex;align-items:center;gap:8px;margin-bottom:0"><input type="checkbox" id="fNoT"> 本次未测体温</label>
  </div>
  <div class="card"><label>症状</label><div class="chips" id="cSym"></div><textarea id="fSym" class="ta" placeholder="主要不舒服的地方，可直接点上面标签，也可自己写"></textarea></div>
  <div class="card"><label>脉象</label><div class="chips" id="cPul"></div><input type="text" id="fPul" class="in" placeholder="其他脉象描述，如：右脉弦细"></div>
  <div class="card"><label>舌苔</label><div class="chips" id="cTon"></div><input type="text" id="fTon" class="in" placeholder="其他舌象描述"></div>
  <div class="card"><label>大便情况</label><div class="chips" id="cSto"></div><input type="text" id="fSto" class="in" placeholder="其他描述，如：一日三次、气味重"></div>
  <div class="card"><label>小便情况</label><div class="chips" id="cUri"></div><input type="text" id="fUri" class="in" placeholder="其他描述"></div>
  <div class="card"><label>可能原因</label><input type="text" id="fCau" class="in" placeholder="如：昨晚受凉、吃了生冷、熬夜上火"></div>
  <div class="card"><label>医生看诊</label><textarea id="fVis" class="ta" placeholder="医院 / 科室 / 医生、诊断结论、医嘱"></textarea></div>
  <div class="card"><label>药物记录</label><textarea id="fMed" class="ta" placeholder="药名、剂量、频次、开始 / 停止时间、服药后反应"></textarea></div>
  <div class="card"><label>备注</label><textarea id="fNot" class="ta" placeholder="其他任何想记下的"></textarea></div>
  <button class="btn pri" id="bSave" type="button"><svg width="18" height="18" viewBox="0 0 24 24" fill="none">
<path fill-rule="evenodd" clip-rule="evenodd" d="M14.5605 3.09961C15.5539 3.09968 16.51 3.47933 17.2334 4.16016L19.6729 6.45605C20.4558 7.19299 20.9003 8.22067 20.9004 9.2959V17C20.9004 19.1539 19.1539 20.9004 17 20.9004H7C4.84609 20.9004 3.09961 19.1539 3.09961 17V7C3.09961 4.84609 4.84609 3.09961 7 3.09961H14.5605ZM7 4.90039C5.8402 4.90039 4.90039 5.8402 4.90039 7V17C4.90039 18.1598 5.8402 19.0996 7 19.0996H7.59961V15.5C7.59961 13.8984 8.89837 12.5996 10.5 12.5996H13.5C15.1016 12.5996 16.4004 13.8984 16.4004 15.5V19.0996H17C18.1598 19.0996 19.0996 18.1598 19.0996 17V9.2959C19.0995 8.71698 18.861 8.16338 18.4395 7.7666L16 5.4707C15.968 5.44055 15.9341 5.41269 15.9004 5.38477V6C15.9004 7.60163 14.6016 8.90039 13 8.90039H11C9.39837 8.90039 8.09961 7.60163 8.09961 6V4.90039H7ZM10.5 14.4004C9.89249 14.4004 9.40039 14.8925 9.40039 15.5V19.0996H14.5996V15.5C14.5996 14.8925 14.1075 14.4004 13.5 14.4004H10.5ZM9.90039 6C9.90039 6.60751 10.3925 7.09961 11 7.09961H13C13.6075 7.09961 14.0996 6.60751 14.0996 6V4.90039H9.90039V6Z" fill="currentColor"/>
</svg>保存这条记录</button>
</section>

<section id="vL" hidden>
  <div class="tools"><button class="btn gho" id="bCopy" type="button">复制全部</button><button class="btn gho" id="bDl" type="button">导出文件</button></div>
  <div id="recs"></div>
</section>
<div class="toast" id="toast"></div>

<script>
(function(){
var D={
sym:"发热|怕冷|无汗|有汗|咳嗽|有痰|咽痛|咽干|头痛|身痛|乏力|流涕|鼻塞|打喷嚏|腹泻|呕吐|腹痛|皮疹|瘙痒|口干|口苦|口淡|失眠|多梦|食欲差|心慌|胸闷".split("|"),
pul:"浮|沉|迟|数|滑|涩|弦|细|洪|弱|结|代|有力|无力".split("|"),
ton:"薄白|白厚|黄腻|厚腻|少苔|剥苔|舌淡|舌红|舌绛|齿痕|裂纹|水滑".split("|"),
sto:"正常|稀溏|水样|便秘|干硬|便血|黑便|未解|里急后重|黏马桶".split("|"),
uri:"正常|清长|短赤|深黄|频数|夜尿多|泡沫多|量少|排尿痛".split("|")};
var KEY="symptom-diary-v1",MEM=[];
function load(){try{var d=JSON.parse(localStorage.getItem(KEY));if(d)return d}catch(e){}return MEM}
function persist(d){MEM=d;try{localStorage.setItem(KEY,JSON.stringify(d))}catch(e){}}
var recs=load();
var $=function(id){return document.getElementById(id)};
function chipify(id,arr,cb){var box=$(id);box.innerHTML="";arr.forEach(function(a){var b=document.createElement("button");b.type="button";b.className="chip";b.textContent=a;b.onclick=function(){b.classList.toggle("on");cb&&cb(a,b.classList.contains("on"))};box.appendChild(b)})}
function picked(id){return [].slice.call(document.querySelectorAll("#"+id+" .chip.on")).map(function(b){return b.textContent})}
function combine(cid,fid){var c=picked(cid),f=$(fid).value.trim();return c.concat(f?[f]:[]).join("、")}
chipify("cSym",D.sym,function(a,on){var ta=$("fSym"),ts=ta.value.split(/[、,，;；\s]+/).filter(Boolean),i=ts.indexOf(a);if(on&&i<0)ts.push(a);if(!on&&i>=0)ts.splice(i,1);ta.value=ts.join("、")});
chipify("cPul",D.pul);chipify("cTon",D.ton);chipify("cSto",D.sto);chipify("cUri",D.uri);
var r=$("fTR"),n=$("fTN"),v=$("tVal"),st=$("tState");
function tshow(){var t=parseFloat(r.value);v.textContent=t.toFixed(1);n.value=t.toFixed(1);st.className="sub";st.textContent="";if(t>=38.5){st.textContent="高热";st.className="sub hot"}else if(t>=37.3){st.textContent="发热";st.className="sub warm"}}
r.oninput=tshow;n.oninput=function(){var x=parseFloat(n.value);if(!isNaN(x)&&x>=35&&x<=42){r.value=x;tshow()}};
$("fNoT").onchange=function(){r.disabled=n.disabled=this.checked};
function nowLocal(){var d=new Date();d.setMinutes(d.getMinutes()-d.getTimezoneOffset());return d.toISOString().slice(0,16)}
$("fTime").value=nowLocal();
var tt;function toast(m){var e=$("toast");e.textContent=m;e.style.display="block";clearTimeout(tt);tt=setTimeout(function(){e.style.display="none"},1800)}
function show(t){$("vF").hidden=t!=="f";$("vL").hidden=t!=="l";$("tF").className=t==="f"?"on":"";$("tL").className=t==="l"?"on":"";if(t==="l")render()}
$("tF").onclick=function(){show("f")};$("tL").onclick=function(){show("l")};
function clearForm(){$("fSym").value=$("fPul").value=$("fTon").value=$("fSto").value=$("fUri").value=$("fCau").value=$("fVis").value=$("fMed").value=$("fNot").value="";["cSym","cPul","cTon","cSto","cUri"].forEach(function(id){[].slice.call($(id).children).forEach(function(b){b.classList.remove("on")})});$("fNoT").checked=false;r.disabled=n.disabled=false;r.value=36.6;tshow();$("fTime").value=nowLocal()}
function save(){var noT=$("fNoT").checked;var it={id:Date.now(),time:$("fTime").value||new Date().toISOString(),temp:noT?null:parseFloat(r.value),symptoms:$("fSym").value.trim(),pulse:combine("cPul","fPul"),tongue:combine("cTon","fTon"),stool:combine("cSto","fSto"),urine:combine("cUri","fUri"),cause:$("fCau").value.trim(),visit:$("fVis").value.trim(),meds:$("fMed").value.trim(),note:$("fNot").value.trim()};recs.push(it);persist(recs);clearForm();show("l");toast("已保存")}
$("bSave").onclick=save;
function fmt(t){var d=new Date(t);return (d.getMonth()+1)+"月"+d.getDate()+"日 "+String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0")}
function lines(it){var L=[["时间",fmt(it.time)],["体温",it.temp==null?"未测":it.temp.toFixed(1)+" ℃"],["症状",it.symptoms],["脉象",it.pulse],["舌苔",it.tongue],["大便",it.stool],["小便",it.urine],["可能原因",it.cause],["医生看诊",it.visit],["药物",it.meds],["备注",it.note]];return L.filter(function(p){return p[1]})}
function promptFor(it){var s="我记了一次生病的症状记录，请从中医角度帮我分析可能的证型、病机，并给日常调理建议（仅供参考，我会结合医生面诊）。\n";lines(it).forEach(function(p){s+=p[0]+"："+p[1]+"\n"});return s}
function render(){$("cnt").textContent=recs.length?("共 "+recs.length+" 条"):"";var box=$("recs");box.innerHTML="";if(!recs.length){box.innerHTML='<div class="empty">还没有记录，点上方「记一笔」开始第一条</div>';return}recs.slice().sort(function(a,b){return a.time<b.time?1:-1}).forEach(function(it){var div=document.createElement("div");div.className="rec";var tb="";if(it.temp!=null){var cls=it.temp>=38.5?"hot":(it.temp>=37.3?"warm":"");tb='<span class="bdg '+cls+'">'+it.temp.toFixed(1)+"℃</span>"}div.innerHTML='<div class="rh"><span class="dt">'+fmt(it.time)+"</span>"+tb+'</div><div class="sm">'+(it.symptoms||"（未填症状）")+"</div>";var dl=document.createElement("div");dl.className="dl";dl.hidden=true;lines(it).forEach(function(p){if(p[0]==="时间")return;var d=document.createElement("div");var b=document.createElement("b");b.textContent=p[0];var sp=document.createElement("span");sp.textContent=p[1];d.appendChild(b);d.appendChild(sp);dl.appendChild(d)});var rf=document.createElement("div");rf.className="rf";rf.hidden=true;var ask=document.createElement("button");ask.className="btn gho";ask.type="button";ask.textContent="发给 Kimi 分析";ask.onclick=function(e){e.stopPropagation();if(window.sendPrompt)window.sendPrompt(promptFor(it));else toast("当前环境不支持");};var del=document.createElement("button");del.className="btn gho";del.type="button";del.textContent="删除";del.onclick=function(e){e.stopPropagation();if(confirm("删除这条记录？")){recs=recs.filter(function(x){return x.id!==it.id});persist(recs);render()}};rf.appendChild(ask);rf.appendChild(del);div.onclick=function(){dl.hidden=!dl.hidden;rf.hidden=dl.hidden};div.appendChild(dl);div.appendChild(rf);box.appendChild(div)})}
function allText(){return recs.slice().sort(function(a,b){return a.time<b.time?1:-1}).map(function(it){return lines(it).map(function(p){return p[0]+"："+p[1]}).join("\n")}).join("\n----\n")}
function copyAll(){if(!recs.length){toast("还没有记录");return}var s=allText();var done=function(){toast("已复制 "+recs.length+" 条记录")};if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(s).then(done,function(){fb(s)})}else fb(s)}
function fb(s){var ta=document.createElement("textarea");ta.value=s;document.body.appendChild(ta);ta.select();try{document.execCommand("copy");toast("已复制")}catch(e){toast("复制失败，请手动选择")}ta.remove()}
function dl(){if(!recs.length){toast("还没有记录");return}var blob=new Blob([JSON.stringify(recs,null,2)],{type:"application/json"});var a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="症状记录.json";a.click();toast("已导出文件")}
$("bCopy").onclick=copyAll;$("bDl").onclick=dl;
tshow();render();
})();
</script>
</div>
</body>
</html>
